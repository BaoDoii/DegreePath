<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DegreePath - Computer Science Planner</title>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body{
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
			line-height: 1.6;
			color: #333;
		}
		
		.container{
			max-width: 900px;
			margin: 0 auto;
			padding 20px;
		}

	</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Semester Planner</h1>
            <p>CSUEB Computer Science - Lower Division</p>
            <a href="/" class="back-link">← Back to Home</a>
        </header>

        <section class="planner-section">
            <h2>Select Completed Courses</h2>
            <div id="courseCheckboxes" class="checkbox-grid">
                <!-- Checkboxes will be generated by JavaScript -->
            </div>

            <h2>Maximum Units</h2>
            <input type="number" id="maxUnits" value="8" min="3" max="18">

            <button onclick="generatePlan()" class="btn-generate">
                Generate Plan
            </button>
        </section>

        <section id="results" class="results-section" style="display: none;">
            <h2>Your Semester Plan</h2>
            <div id="courseResults"></div>
            <div id="summary"></div>
        </section>
    </div>
</html>
